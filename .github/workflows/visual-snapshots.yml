name: Website UI screenshots (Desktop + Mobile)
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'public/**'
      - '.github/workflows/visual-snapshots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install application
        run: npm install --no-audit --no-fund
      - name: Install browser testing tools
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build production application
        run: npm run build
      - name: Start local production site
        run: |
          npm run start -- --port 3000 > /tmp/suphalak-site.log 2>&1 &
          for i in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/suphalak-site.log
          exit 1
      - name: Verify UTM cleanup redirect
        run: |
          headers="$(curl --silent --show-error --head 'http://127.0.0.1:3000/?utm_source=chatgpt.com')"
          echo "$headers"
          echo "$headers" | grep -Eq '^HTTP/.* 308'
          echo "$headers" | grep -Eiq '^location: /'
      - name: Capture 1440 px Desktop full page
        run: |
          mkdir -p evidence
          npx playwright screenshot --browser chromium --viewport-size="1440,900" --full-page http://127.0.0.1:3000/ evidence/desktop.png
      - name: Capture 390 px Mobile full page
        run: |
          npx playwright screenshot --browser chromium --viewport-size="390,844" --full-page http://127.0.0.1:3000/ evidence/mobile.png
      - name: Save screenshot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: suphalak-ui-desktop-mobile
          path: evidence/*.png
          if-no-files-found: warn
          retention-days: 14
