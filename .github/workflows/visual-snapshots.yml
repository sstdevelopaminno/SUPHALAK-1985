name: Website UI screenshots (Desktop + Mobile)
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'public/**'
      - '.github/workflows/visual-snapshots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install application
        run: npm install --no-audit --no-fund
      - name: Install browser testing tools
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build production application
        run: npm run build
      - name: Start local production site
        run: |
          npm run start -- --port 3000 > /tmp/suphalak-site.log 2>&1 &
          for i in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/suphalak-site.log
          exit 1
      - name: Verify UTM cleanup redirect
        run: |
          headers="$(curl --silent --show-error --head 'http://127.0.0.1:3000/?utm_source=chatgpt.com')"
          echo "$headers"
          echo "$headers" | grep -Eq '^HTTP/.* 308'
          echo "$headers" | grep -Eiq '^location: /'
      - name: Capture 1600x856 Desktop viewport
        run: |
          mkdir -p evidence
          npx playwright screenshot --browser chromium --viewport-size="1600,856" http://127.0.0.1:3000/ evidence/desktop.png
      - name: Capture 390x844 Mobile viewport
        run: |
          npx playwright screenshot --browser chromium --viewport-size="390,844" http://127.0.0.1:3000/ evidence/mobile.png
      - name: Verify responsive legibility and quote form
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          const browser = await chromium.launch({ headless: true });
          try {
            for (const [name, width, height] of [["desktop", 1600, 856], ["mobile", 390, 844]]) {
              const page = await browser.newPage({ viewport: { width, height } });
              await page.goto("http://127.0.0.1:3000/", { waitUntil: "networkidle" });
              const report = await page.evaluate(() => {
                const heading = document.querySelector(innerWidth <= 760 ? ".mobile-hero-headline" : ".desktop-hero-headline");
                const h = heading ? parseFloat(getComputedStyle(heading).fontSize) : 0;
                return { overflow: document.documentElement.scrollWidth > innerWidth + 2, headingPx: h };
              });
              if (report.overflow) throw new Error(name + ": horizontal page overflow");
              if (report.headingPx < (name === "desktop" ? 32 : 24)) throw new Error(name + ": heading too small " + report.headingPx);
              await page.locator(".hero-buttons .btn-outline").click();
              await page.locator(".quote-form input").first().waitFor();
              const inputSize = await page.locator(".quote-form input").first().evaluate(el => parseFloat(getComputedStyle(el).fontSize));
              if (inputSize < (name === "desktop" ? 14 : 16)) throw new Error(name + ": form input too small " + inputSize);
              await page.screenshot({ path: "evidence/quote-" + name + ".png" });
              console.log(JSON.stringify({ name, ...report, quoteInputPx: inputSize }));
              await page.close();
            }
          } finally { await browser.close(); }
          NODE
      - name: Save screenshot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: suphalak-ui-desktop-mobile
          path: evidence/*.png
          if-no-files-found: warn
          retention-days: 14
